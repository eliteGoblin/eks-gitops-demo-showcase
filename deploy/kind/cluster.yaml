# Local Kubernetes for testing the Helm chart. Host ports 8180/8182 avoid the docker-compose stack on 8080/8082.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eks-gitops-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraPortMappings:
      - containerPort: 30180 # Keycloak NodePort
        hostPort: 8180
      - containerPort: 30182 # demo-api NodePort
        hostPort: 8182
