apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-svc.fullname" . }}
  labels:
    {{- include "payments-svc.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  OIDC_ALLOWED_CLIENTS: {{ join "," .Values.config.allowedClients | quote }}
  ENV: {{ .Values.config.env | quote }}
  PORT: {{ .Values.config.port | quote }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimitRps | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.telemetry.sampleRatio | quote }}
