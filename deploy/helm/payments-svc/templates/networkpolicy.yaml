{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payments-svc.fullname" . }}
  labels:
    {{- include "payments-svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payments-svc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowFromPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port | int }}
{{- end }}
