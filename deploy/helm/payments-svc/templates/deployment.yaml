apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payments-svc.fullname" . }}
  labels:
    {{- include "payments-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The store is in memory: a rolling update would briefly run two pods with
  # different idempotency state, so the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "payments-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payments-svc.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: payments
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "payments-svc.fullname" . }}
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.goMemLimit | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port | int }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: # native action (Kubernetes 1.30+): distroless has no shell
                seconds: {{ .Values.shutdown.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
