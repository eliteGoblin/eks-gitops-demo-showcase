apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  ENV: {{ .Values.config.env | quote }}
  PLAYGROUND_ENABLED: {{ .Values.config.playgroundEnabled | quote }}
  INTROSPECTION_ENABLED: {{ .Values.config.introspectionEnabled | quote }}
  PERSISTED_QUERIES: {{ .Values.config.persistedQueries | quote }}
  PORT: {{ .Values.config.port | quote }}
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  TRUST_CF_CONNECTING_IP: {{ .Values.config.trustCfConnectingIp | quote }}
  CORS_ALLOWED_ORIGINS: {{ join "," .Values.config.corsAllowedOrigins | quote }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimitRps | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  OIDC_ALLOWED_CLIENTS: {{ join "," .Values.config.oidcAllowedClients | quote }}
  STORE: {{ ternary "postgres" "memory" .Values.database.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.telemetry.sampleRatio | quote }}
  PAYMENTS_ENABLED: {{ .Values.payments.enabled | quote }}
  {{- if .Values.payments.enabled }}
  PAYMENTS_URL: {{ .Values.payments.url | quote }}
  PAYMENTS_CLIENT_ID: {{ .Values.payments.clientId | quote }}
  {{- with .Values.payments.tokenUrl }}
  PAYMENTS_TOKEN_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
