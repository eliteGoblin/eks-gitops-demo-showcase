apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak-config-cli
          image: adorsys/keycloak-config-cli:6.5.1-26.5.5
          # PW_<USERNAME> for every user in realm.yaml (user-passwords.yaml).
          envFrom:
            - secretRef: { name: keycloak-user-passwords }
          env:
            - { name: KEYCLOAK_URL, value: "http://keycloak.keycloak.svc:8080" }
            - name: KEYCLOAK_USER
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KEYCLOAK_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            - { name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true" }
            - { name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: "300s" }
            - { name: IMPORT_FILES_LOCATIONS, value: /config/realm.yaml }
            - { name: IMPORT_VARSUBSTITUTION_ENABLED, value: "true" }
            # Add and update, never delete: built-in clients and scopes stay untouched.
            - { name: IMPORT_MANAGED_CLIENT, value: no-delete }
            - { name: IMPORT_MANAGED_CLIENTSCOPE, value: no-delete }
            - { name: IMPORT_MANAGED_GROUP, value: no-delete }
            - name: ARGOCD_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: argocd-client-secret, key: clientSecret } }
            - name: LOAD_GENERATOR_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: load-generator-client-secret, key: clientSecret } }
            - name: GRAFANA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: grafana-client-secret, key: clientSecret } }
            - name: DEMO_API_SVC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: demo-api-svc-client-secret, key: clientSecret } }
          volumeMounts:
            - { name: realm, mountPath: /config }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
