# Client secret of demo-api-svc (demo-api's identity towards payments-svc),
# injected into the realm as $(env:DEMO_API_SVC_CLIENT_SECRET) by
# keycloak-config-cli. demo-api reads the same Secrets Manager value in the
# demo namespace (charts/demo-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-svc-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: demo-api-svc-client-secret }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/demo-api-svc, property: clientSecret }
