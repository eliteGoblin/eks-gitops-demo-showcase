# The same Secrets Manager value Grafana uses (observability/grafana-oidc), injected
# into the realm as $(env:GRAFANA_CLIENT_SECRET) by keycloak-config-cli.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: grafana-client-secret }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/grafana/oidc, property: clientSecret }
