# The same Secrets Manager value Argo CD uses (argocd/argocd-oidc), injected
# into the realm as $(env:ARGOCD_CLIENT_SECRET) by keycloak-config-cli.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: argocd-client-secret }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/argocd/oidc, property: clientSecret }
