# The demo users' passwords: Secrets Manager demo/keycloak/users holds a JSON
# map username → password (generated by the app repo's scripts/secrets-seed.sh).
# The Job puts them into the realm as $(env:PW_<USERNAME>); they are never in
# Git or in the keycloak-realm ConfigMap. One entry per user in realm.yaml: a
# key missing in Secrets Manager fails this ExternalSecret, so the sync stops
# before the import instead of importing a half-substituted realm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-user-passwords
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: keycloak-user-passwords }
  data:
    - secretKey: PW_ZHAOLIN_SUN
      remoteRef: { key: demo/keycloak/users, property: zhaolin.sun }
    - secretKey: PW_CASE_OFFICER
      remoteRef: { key: demo/keycloak/users, property: case.officer }
    - secretKey: PW_DEMO_GUEST
      remoteRef: { key: demo/keycloak/users, property: demo.guest }
    - secretKey: PW_SAM_NOMINEE
      remoteRef: { key: demo/keycloak/users, property: sam.nominee }
    - secretKey: PW_RILEY_PROVIDER
      remoteRef: { key: demo/keycloak/users, property: riley.provider }
