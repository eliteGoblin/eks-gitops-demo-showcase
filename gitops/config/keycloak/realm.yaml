# Production realm as code, applied by keycloak-config-cli (PostSync Job) on every sync.
# Differences from the dev realm (deploy/keycloak/realm.json in the app repo):
#   - no verify-cli password-grant client; exact redirect URIs, no localhost
#   - refresh-token rotation (revokeRefreshToken, max reuse 0); SSO idle 30 min, max 10 h
#   - argocd client + groups scope for Argo CD RBAC; its secret comes from $(env:ARGOCD_CLIENT_SECRET)
#   - grafana client, same pattern ($(env:GRAFANA_CLIENT_SECRET)); groups grafana-admins / grafana-viewers map to Grafana roles
#   - demo-api-svc: demo-api's own identity (client credentials) towards payments-svc; secret $(env:DEMO_API_SVC_CLIENT_SECRET),
#     its service account holds the payments-svc client role payments:write
# Users' passwords are never in this file: each is the variable PW_<USERNAME>, filled in at import
# time from the Secret keycloak-user-passwords (Secrets Manager demo/keycloak/users, generated by
# the app repo's scripts/secrets-seed.sh). Every import that runs (this file or a PW_* value
# changed; otherwise the checksum skips it) re-sets each listed user's password.
# (keycloak-config-cli substitutes comments too: an undefined variable here fails the import.)
realm: demo
enabled: true
displayName: eks-gitops-demo
sslRequired: external
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 36000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
bruteForceProtected: true
failureFactor: 10
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
maxDeltaTimeSeconds: 43200
permanentLockout: false
roles:
  realm:
    - name: participant
      description: A person who holds a support plan
    - name: nominee
      description: Acts for a participant under an active delegation
    - name: provider
      description: Provider staff; linked to a provider via provider_id
    - name: agency_staff
      description: Agency staff; may read everything (audited) and approve claims
  client:
    payments-svc:
      - name: payments:write
        description: Create payments (demo-api's service account)
      - name: payments:read
        description: Read payments
groups:
  - name: argocd-admins
    path: /argocd-admins
  - name: argocd-readonly
    path: /argocd-readonly
  - name: grafana-admins
    path: /grafana-admins
  - name: grafana-viewers
    path: /grafana-viewers
clients:
  - clientId: spa
    name: Browser pages (public client, Authorization Code + PKCE S256)
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: ""
    baseUrl: /
    redirectUris:
      - https://app.frankbluemind.com/
      - https://app.frankbluemind.com/playground
    webOrigins:
      - https://app.frankbluemind.com
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://app.frankbluemind.com/##https://app.frankbluemind.com/playground
    fullScopeAllowed: true
    protocolMappers:
      - name: demo-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: demo-api
          id.token.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
      - name: participant_id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: participant_id
          claim.name: participant_id
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
      - name: provider_id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: provider_id
          claim.name: provider_id
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
      - name: nominee_id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: nominee_id
          claim.name: nominee_id
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
  - clientId: demo-api
    name: GraphQL API (audience only, no login flows)
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  - clientId: payments-svc
    name: payments-svc (resource server; audience and client roles only)
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false
  - clientId: demo-api-svc
    name: demo-api service account (confidential, client credentials; calls payments-svc)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:DEMO_API_SVC_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    fullScopeAllowed: true
    protocolMappers:
      - name: payments-svc-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: payments-svc
          id.token.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
  - clientId: argocd
    name: Argo CD (confidential, Authorization Code)
    enabled: true
    protocol: openid-connect
    publicClient: false
    secret: $(env:ARGOCD_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://argocd.frankbluemind.com/auth/callback
    webOrigins:
      - https://argocd.frankbluemind.com
    attributes:
      post.logout.redirect.uris: https://argocd.frankbluemind.com/applications
    defaultClientScopes:
      - web-origins
      - acr
      - profile
      - roles
      - email
      - basic
      - groups
  - clientId: load-generator
    name: k6 load generator (confidential, client credentials; its service account is participant P3)
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    rootUrl: ""
    baseUrl: /
    fullScopeAllowed: true
    protocolMappers:
      - name: demo-api-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: demo-api
          id.token.claim: "false"
          access.token.claim: "true"
          introspection.token.claim: "true"
      - name: participant_id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: participant_id
          claim.name: participant_id
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
    secret: $(env:LOAD_GENERATOR_CLIENT_SECRET)
  - clientId: grafana
    name: Grafana (confidential, Authorization Code + PKCE)
    enabled: true
    protocol: openid-connect
    publicClient: false
    secret: $(env:GRAFANA_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://grafana.frankbluemind.com/login/generic_oauth
    webOrigins:
      - https://grafana.frankbluemind.com
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: https://grafana.frankbluemind.com/login
    defaultClientScopes:
      - web-origins
      - acr
      - profile
      - roles
      - email
      - basic
      - groups
users:
  - username: zhaolin.sun
    enabled: true
    emailVerified: true
    email: zhaolin.sun@example.com
    firstName: Zhaolin
    lastName: Sun
    credentials:
      - type: password
        value: "$(env:PW_ZHAOLIN_SUN)"
        temporary: false
    realmRoles:
      - participant
    attributes:
      participant_id:
        - P1
    groups:
      - argocd-admins
      - grafana-admins
  - username: case.officer
    enabled: true
    emailVerified: true
    email: case.officer@example.com
    firstName: Casey
    lastName: Officer
    credentials:
      - type: password
        value: "$(env:PW_CASE_OFFICER)"
        temporary: false
    realmRoles:
      - agency_staff
  - username: demo.guest
    enabled: true
    emailVerified: true
    email: demo.guest@example.com
    firstName: Jordan
    lastName: Lee
    credentials:
      - type: password
        value: "$(env:PW_DEMO_GUEST)"
        temporary: false
    realmRoles:
      - participant
    attributes:
      participant_id:
        - P3
    groups:
      - argocd-readonly
      - grafana-viewers
  - username: sam.nominee
    enabled: true
    emailVerified: true
    email: sam.nominee@example.com
    firstName: Sam
    lastName: Rivera
    credentials:
      - type: password
        value: "$(env:PW_SAM_NOMINEE)"
        temporary: false
    realmRoles:
      - nominee
    attributes:
      nominee_id:
        - N1
  - username: riley.provider
    enabled: true
    emailVerified: true
    email: riley.provider@example.com
    firstName: Riley
    lastName: Chen
    credentials:
      - type: password
        value: "$(env:PW_RILEY_PROVIDER)"
        temporary: false
    realmRoles:
      - provider
    attributes:
      provider_id:
        - PR1
  - username: service-account-load-generator
    enabled: true
    serviceAccountClientId: load-generator
    realmRoles:
      - participant
    attributes:
      participant_id:
        - P3
  - username: service-account-demo-api-svc
    enabled: true
    serviceAccountClientId: demo-api-svc
    clientRoles:
      payments-svc:
        - payments:write
components:
  org.keycloak.userprofile.UserProfileProvider:
    - providerId: declarative-user-profile
      subComponents: {}
      config:
        kc.user.profile.config:
          - '{"attributes": [{"name": "username", "displayName": "${username}", "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false}, {"name": "email", "displayName": "${email}", "validations": {"email": {}, "length": {"max": 255}}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false}, {"name": "firstName", "displayName": "${firstName}", "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false}, {"name": "lastName", "displayName": "${lastName}", "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}}, "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": false}, {"name": "participant_id", "displayName": "Participant id", "permissions": {"view": ["admin", "user"], "edit": ["admin"]}, "multivalued": false}, {"name": "provider_id", "displayName": "Provider id", "permissions": {"view": ["admin", "user"], "edit": ["admin"]}, "multivalued": false}, {"name": "nominee_id", "displayName": "Nominee id", "permissions": {"view": ["admin", "user"], "edit": ["admin"]}, "multivalued": false}], "groups": [{"name": "user-metadata", "displayDescription": "Attributes, which refer to user metadata", "displayHeader": "User metadata"}], "unmanagedAttributePolicy": "ENABLED"}'
clientScopes:
  - name: groups
    description: Group membership (for Argo CD and Grafana RBAC)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
