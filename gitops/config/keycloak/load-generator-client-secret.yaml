# Client secret of the k6 load generator, injected into the realm as
# $(env:LOAD_GENERATOR_CLIENT_SECRET) by keycloak-config-cli. The k6 Job
# reads the same Secrets Manager value in the demo namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: load-generator-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: load-generator-client-secret }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/load-generator, property: clientSecret }
