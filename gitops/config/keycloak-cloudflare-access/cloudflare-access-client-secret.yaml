# Client secret of the Keycloak client cloudflare-access. Terraform generates
# it, stores {"client_id": ..., "client_secret": ...} in Secrets Manager and
# gives the same value to the Access identity provider. The Job next to this
# file puts it into the client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-access-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: cloudflare-access-client-secret }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/keycloak/cloudflare-access, property: client_secret }
