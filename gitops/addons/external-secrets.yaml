# Installed on every cluster whose Argo CD cluster Secret has label enable_external_secrets=true.
# Values marked {{...}} come from that Secret's annotations (Terraform outputs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector: { matchLabels: { enable_external_secrets: "true" } }
  template:
    metadata:
      name: "external-secrets"
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: "2.12.0"
        helm:
          releaseName: external-secrets
          valuesObject:
            installCRDs: true
            serviceAccount: { name: external-secrets }
      destination: { server: "{{.server}}", namespace: external-secrets }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
