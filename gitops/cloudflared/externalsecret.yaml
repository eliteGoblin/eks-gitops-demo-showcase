# The tunnel token: a plain string in Secrets Manager, created by Terraform
# together with the tunnel. Until it exists (and external-secrets may read it)
# this ExternalSecret reports SecretSyncedError and the connector pods wait in
# CreateContainerConfigError; nothing else depends on them. external-secrets
# keeps retrying, and Reloader restarts the connectors when the token changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: cloudflared-token }
  data:
    - secretKey: token
      remoteRef: { key: demo/cloudflare/tunnel-token }
