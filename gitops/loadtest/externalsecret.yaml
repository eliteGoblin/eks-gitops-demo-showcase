# Client secret of the Keycloak client "load-generator" (client credentials;
# its service account is a demo participant), read by the k6 Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: load-generator
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: load-generator }
  data:
    - secretKey: client-secret
      remoteRef: { key: demo/load-generator, property: clientSecret }
