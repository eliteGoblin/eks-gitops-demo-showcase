apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  annotations:
    # Run on every sync and replace the previous run's Job.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345 # the k6 image's user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "/scripts/graphql.js"]
          env:
            - name: BASE_URL
              value: http://demo-api.demo.svc:8082
            - name: TOKEN_URL
              value: https://auth.frankbluemind.com/realms/demo/protocol/openid-connect/token
            - name: PEAK_VUS
              value: "30"
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: load-generator # client secret of the load-generator Keycloak client (ESO in EKS)
                  key: client-secret
          volumeMounts:
            - { name: script, mountPath: /scripts, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: k6-script
