# demo-api's database connection string (wave 0, before demo-api), from the
# RDS-managed secret via external-secrets. Separate from demo-api so the Secret
# exists before demo-api's PreSync migration Job needs it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector: {matchLabels: {environment: dev}}
  template:
    metadata:
      name: demo-secrets
      annotations: {argocd.argoproj.io/sync-wave: "0"}
    spec:
      project: default
      source:
        repoURL: git@github.com:eliteGoblin/eks-gitops-demo-gitops.git
        targetRevision: main
        path: charts/demo-secrets
        helm:
          valuesObject:
            db:
              host: '{{index .metadata.annotations "rds_endpoint"}}'
              masterSecretArn: '{{index .metadata.annotations "rds_master_secret_arn"}}'
      destination: {server: "{{.server}}", namespace: demo}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
