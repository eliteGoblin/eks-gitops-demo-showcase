# Realm as code (wave 1): re-applied by a PostSync Job whenever config/keycloak changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-config
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: git@github.com:eliteGoblin/eks-gitops-demo-gitops.git
    targetRevision: main
    path: config/keycloak
  destination: { server: https://kubernetes.default.svc, namespace: keycloak }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
