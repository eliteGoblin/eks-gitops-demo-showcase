# Grafana prerequisites (wave 1, before grafana): credentials from Secrets
# Manager via external-secrets, Grafana's database on the shared RDS instance,
# and the provisioned dashboards. Endpoint and secret ARN come from the cluster
# Secret (Terraform outputs).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-prereqs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector: {matchLabels: {environment: dev, enable_observability: "true"}}
  template:
    metadata:
      name: grafana-prereqs
      annotations: {argocd.argoproj.io/sync-wave: "1"}
    spec:
      project: default
      source:
        repoURL: git@github.com:eliteGoblin/eks-gitops-demo-gitops.git
        targetRevision: main
        path: charts/grafana-prereqs
        helm:
          valuesObject:
            db:
              host: '{{index .metadata.annotations "rds_endpoint"}}'
              masterSecretArn: '{{index .metadata.annotations "rds_master_secret_arn"}}'
      destination: {server: "{{.server}}", namespace: observability}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
