# demo-api's database connection string. It uses the RDS master user and the
# application database (an accepted demo shortcut). RDS rotates the password;
# external-secrets refreshes this Secret and Reloader restarts demo-api. User
# and password are URL-encoded, so any generated character is safe in the URL.
# Refreshed every minute: until it is, a new or restarted pod gets the old
# password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-db
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: demo-api-db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@{{ required "db.host" .Values.db.host }}:5432/{{ .Values.db.name }}?sslmode={{ .Values.db.sslmode }}"
  data:
    - secretKey: username
      remoteRef: { key: {{ required "db.masterSecretArn" .Values.db.masterSecretArn | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.db.masterSecretArn | quote }}, property: password }
---
# demo-api's client secret for payments-svc calls (Keycloak client
# demo-api-svc, client credentials). The realm Job reads the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-payments
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: demo-api-payments }
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/demo-api-svc, property: clientSecret }
---
# The partner API key (secrets as code: secrets/dev/demo-api.enc.yaml in the app
# repo → CI secrets-sync → Secrets Manager), delivered to demo-api two ways for
# the rotation demo. Same source, two Secrets:
#   demo-api-partner-file: mounted as a file; demo-api re-reads it in place.
#     Refreshes every 30s and is NOT watched by Reloader.
#   demo-api-partner-env: PARTNER_API_KEY; Reloader rolls demo-api when it
#     changes. Refreshes every 3m, so the in-place file reload is visible
#     before the rollout replaces the pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-partner-file
spec:
  refreshInterval: 30s
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: demo-api-partner-file }
  data:
    - secretKey: api_key
      remoteRef: { key: demo/dev/demo-api/partner-api, property: api_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-partner-env
spec:
  refreshInterval: 3m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: demo-api-partner-env }
  data:
    - secretKey: api_key
      remoteRef: { key: demo/dev/demo-api/partner-api, property: api_key }
