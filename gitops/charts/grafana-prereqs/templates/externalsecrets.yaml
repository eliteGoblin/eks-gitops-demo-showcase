# Grafana's database login straight from the RDS-managed secret (rotated by RDS;
# external-secrets refreshes the copy every minute and Reloader restarts Grafana).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: grafana-db }
  data:
    - secretKey: username
      remoteRef: { key: {{ required "db.masterSecretArn" .Values.db.masterSecretArn | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.db.masterSecretArn | quote }}, property: password }
---
# Built-in admin (local login and API provisioning); the Helm chart's admin.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: grafana-admin }
  data:
    - secretKey: admin-user
      remoteRef: { key: {{ .Values.adminSecretKey }}, property: username }
    - secretKey: admin-password
      remoteRef: { key: {{ .Values.adminSecretKey }}, property: password }
---
# The same value Keycloak's realm config uses for client "grafana" ($(env:GRAFANA_CLIENT_SECRET)).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: grafana-oidc }
  data:
    - secretKey: clientSecret
      remoteRef: { key: {{ .Values.oidcSecretKey }}, property: clientSecret }
