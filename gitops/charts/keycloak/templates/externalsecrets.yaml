# Database credentials straight from the RDS-managed secret. RDS rotates the
# password; external-secrets refreshes the copy and Reloader restarts Keycloak.
# Refreshed every minute: until it is, a restarted pod gets the old password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: keycloak-db }
  data:
    - secretKey: username
      remoteRef: { key: {{ required "db.masterSecretArn" .Values.db.masterSecretArn | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.db.masterSecretArn | quote }}, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: keycloak-admin }
  data:
    - secretKey: username
      remoteRef: { key: {{ .Values.adminSecretKey }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ .Values.adminSecretKey }}, property: password }
