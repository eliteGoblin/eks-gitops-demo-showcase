# Client secret for Argo CD's Keycloak login. Generated once by
# scripts/secrets-seed.sh into Secrets Manager; Keycloak's realm config reads
# the same value. Argo CD resolves "$argocd-oidc:clientSecret" from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef: { key: demo/argocd/oidc, property: clientSecret }
