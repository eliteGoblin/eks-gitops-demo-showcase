# AWS Secrets Manager as the source of truth for secrets. external-secrets
# authenticates with its own Pod Identity role (no credentials in this file),
# which may read only demo/* and the RDS-managed master secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
