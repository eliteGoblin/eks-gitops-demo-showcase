# Argo CD pulls the demo-api Helm chart from ECR (OCI). ECR tokens expire after
# 12 h, so external-secrets mints a fresh one every 6 h into an Argo CD
# repository Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: ecr-token
  namespace: argocd
spec:
  region: ap-southeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-chart-repo
  namespace: argocd
spec:
  refreshInterval: 6h
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: ecr-token
  target:
    name: ecr-chart-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: ecr-charts
        type: helm
        enableOCI: "true"
        url: 852544369865.dkr.ecr.ap-southeast-2.amazonaws.com/charts
        username: "{{ .username }}"
        password: "{{ .password }}"
