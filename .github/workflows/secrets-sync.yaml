name: secrets-sync
# Secrets as code: human-authored values live in Git as sops-encrypted files
# (secrets/<env>/<service>.enc.yaml, KMS key alias/sops-demo). On main this
# workflow decrypts them with the ci-secrets-sync role and writes AWS Secrets
# Manager (demo/<env>/<service>/<key>). Pods still get them through External
# Secrets, so a merged change reaches the cluster with no manual step. Values
# are never printed: the summary lists secret names and created/updated/unchanged.
on:
  push:
    branches: [main]
    paths:
      - secrets/**
      - .sops.yaml
      - scripts/ci/secrets-sync.sh
      - .github/workflows/secrets-sync.yaml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: secrets-sync
  cancel-in-progress: false
env:
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b # sops-v3.13.3.linux.amd64

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sops (pinned, checksum verified)
        run: |
          curl -sSfL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum --check --quiet
          sudo install -m 0755 sops /usr/local/bin/sops && sops --version
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SECRETS_SYNC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Decrypt and sync to Secrets Manager
        run: scripts/ci/secrets-sync.sh secrets
