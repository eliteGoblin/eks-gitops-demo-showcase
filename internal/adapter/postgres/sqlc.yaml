version: "2"
sql:
  - engine: postgresql
    schema: migrations/schema
    queries: queries
    gen:
      go:
        package: sqlcdb
        out: sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { type: time.Time, pointer: true }
