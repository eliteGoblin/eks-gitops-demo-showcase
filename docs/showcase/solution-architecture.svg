<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Solution architecture</title>
  <desc id="d">Users reach the system only through Cloudflare (DNS and TLS, Access for the admin tools, the Tunnel). Inside AWS, EKS runs cloudflared, demo-api, payments-svc, Keycloak, Grafana and the platform helpers; RDS, Secrets Manager, ECR and the observability services sit around it. GitHub Actions releases to ECR and applies Terraform; Argo CD watches the gitops repo. Five numbered flows: request, login, service call, release, GitOps sync.</desc>
  <style>
    .bg{fill:#f7f8fa}
    .card{fill:#ffffff;stroke:#dfe3e8;stroke-width:1.5}
    .zone{fill:none;stroke:#9aa4b1;stroke-width:1.5;stroke-dasharray:7 5}
    .soft{fill:#e3eef9;stroke:#0b5fa5;stroke-width:1.5}
    .okbox{fill:#e2f3ea;stroke:#1e7f4f;stroke-width:1.5}
    .warnbox{fill:#fff3dc;stroke:#9a5b00;stroke-width:1.5}
    .legend{fill:#ffffff;stroke:#0b5fa5;stroke-width:1.5}
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b1f24;font-size:13px}
    .title{font-size:19px;font-weight:700}
    .sub{font-size:13px;fill:#5b6470}
    .zl{font-size:13px;font-weight:700;fill:#5b6470}
    .b{font-size:14px;font-weight:700}
    .sb{font-size:12px;font-weight:700}
    .s{font-size:12.5px;fill:#5b6470}
    .xs{font-size:11.5px;fill:#5b6470}
    .lbl{font-size:11.5px;fill:#0b5fa5;font-style:italic}
    .badge{fill:#0b5fa5}
    .bt{font-size:11px;font-weight:700;fill:#ffffff;text-anchor:middle}
    .arr{fill:none;stroke:#0b5fa5;stroke-width:2;marker-end:url(#ah)}
    .arr2{fill:none;stroke:#5b6470;stroke-width:1.8;marker-end:url(#ah2)}
    .sync{fill:none;stroke:#1e7f4f;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#ah3)}
    .stub{fill:none;stroke:#5b6470;stroke-width:1.8}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5fa5"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6470"/></marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e7f4f"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700" rx="12"/>

  <text class="title" x="30" y="34">Solution architecture</text>
  <text class="sub" x="30" y="56">Core components and how they connect. Numbered badges mark the main flows (legend at the bottom right).</text>

  <!-- users -->
  <rect class="card" x="30" y="100" width="160" height="62" rx="8"/>
  <text class="b" x="42" y="123">Users</text>
  <text class="s" x="42" y="141">browser · API client</text>

  <!-- Cloudflare band -->
  <rect class="zone" x="230" y="78" width="940" height="96" rx="10"/>
  <text class="zl" x="242" y="96">Cloudflare edge</text>
  <rect class="warnbox" x="250" y="104" width="230" height="60" rx="8"/>
  <text class="b" x="262" y="124">DNS + TLS</text>
  <text class="s" x="262" y="141">proxied records, Universal SSL</text>
  <text class="s" x="262" y="156">app. auth. argocd. grafana.</text>
  <rect class="warnbox" x="510" y="104" width="270" height="60" rx="8"/>
  <text class="b" x="522" y="124">Access</text>
  <text class="s" x="522" y="141">guards argocd. and grafana. only</text>
  <text class="s" x="522" y="156">Keycloak is its OIDC identity provider</text>
  <rect class="warnbox" x="810" y="104" width="340" height="60" rx="8"/>
  <text class="b" x="822" y="124">Tunnel: the only ingress</text>
  <text class="s" x="822" y="141">cloudflared connects outbound:</text>
  <text class="s" x="822" y="156">no inbound ports, no load balancer</text>

  <!-- AWS band -->
  <rect class="zone" x="30" y="196" width="1140" height="372" rx="10"/>
  <text class="zl" x="42" y="214">AWS ap-southeast-2</text>

  <!-- column A -->
  <rect class="card" x="50" y="236" width="190" height="56" rx="8"/>
  <text class="b" x="62" y="256">Secrets Manager</text>
  <text class="s" x="62" y="273">every runtime secret</text>
  <rect class="card" x="50" y="470" width="190" height="56" rx="8"/>
  <text class="b" x="62" y="490">ECR</text>
  <text class="s" x="62" y="507">images + Helm charts (OCI)</text>

  <!-- EKS -->
  <rect class="zone" x="270" y="226" width="630" height="326" rx="10"/>
  <text class="zl" x="282" y="244">EKS · deployed by Argo CD</text>

  <rect class="card" x="480" y="236" width="200" height="44" rx="8"/>
  <text class="sb" x="490" y="254">External Secrets + Reloader</text>
  <text class="xs" x="490" y="270">Secrets Manager → Secrets → pods</text>

  <rect class="soft" x="720" y="236" width="180" height="44" rx="8"/>
  <text class="b" x="730" y="254">cloudflared ×2</text>
  <text class="xs" x="730" y="270">outbound connectors</text>

  <rect class="okbox" x="280" y="300" width="150" height="60" rx="8"/>
  <text class="b" x="290" y="320">demo-api</text>
  <text class="s" x="290" y="337">Go · GraphQL</text>
  <text class="s" x="290" y="352">HPA 2–6 pods</text>
  <rect class="okbox" x="455" y="300" width="120" height="60" rx="8"/>
  <text class="b" x="465" y="320">payments-svc</text>
  <text class="s" x="465" y="337">internal only</text>
  <rect class="okbox" x="600" y="300" width="90" height="60" rx="8"/>
  <text class="b" x="610" y="320">Grafana</text>
  <text class="s" x="610" y="337">dashboards</text>
  <rect class="okbox" x="715" y="300" width="170" height="60" rx="8"/>
  <text class="b" x="725" y="320">Keycloak</text>
  <text class="s" x="725" y="337">OpenID Connect provider</text>
  <text class="s" x="725" y="352">realm as code</text>

  <text class="xs" x="370" y="418">HPA 2–6 · PDB · rolling updates</text>
  <text class="xs" x="370" y="434">NetworkPolicies: cloudflared-only ingress</text>
  <rect class="card" x="650" y="400" width="235" height="50" rx="8"/>
  <text class="sb" x="660" y="418">ADOT collector · Fluent Bit</text>
  <text class="xs" x="660" y="434">traces, metrics, logs → AWS</text>

  <rect class="okbox" x="290" y="470" width="110" height="50" rx="8"/>
  <text class="b" x="300" y="490">Argo CD</text>
  <text class="s" x="300" y="507">GitOps</text>

  <!-- column C -->
  <rect class="card" x="930" y="300" width="220" height="60" rx="8"/>
  <text class="b" x="942" y="320">RDS Postgres</text>
  <text class="s" x="942" y="337">demo-api · Keycloak · Grafana</text>
  <text class="s" x="942" y="352">one managed instance</text>
  <rect class="card" x="930" y="400" width="220" height="62" rx="8"/>
  <text class="b" x="942" y="420">Observability</text>
  <text class="s" x="942" y="437">X-Ray · Managed Prometheus</text>
  <text class="s" x="942" y="452">CloudWatch Logs</text>

  <!-- GitHub band -->
  <rect class="zone" x="30" y="580" width="690" height="96" rx="10"/>
  <text class="zl" x="42" y="598">GitHub</text>
  <rect class="card" x="50" y="606" width="400" height="62" rx="8"/>
  <text class="b" x="62" y="626">App repo · GitHub Actions</text>
  <text class="s" x="62" y="643">tests, gitleaks, tf plan → arm64 image + Helm chart,</text>
  <text class="s" x="62" y="658">cosign + SBOM; Terraform apply via OIDC (AWS, Cloudflare)</text>
  <rect class="card" x="480" y="606" width="220" height="62" rx="8"/>
  <text class="b" x="492" y="626">GitOps repo</text>
  <text class="s" x="492" y="643">watched by Argo CD;</text>
  <text class="s" x="492" y="658">CI bumps the chart versions</text>

  <!-- legend -->
  <rect class="legend" x="740" y="580" width="430" height="96" rx="8"/>
  <text class="xs" x="752" y="596">1 Request: user → DNS/TLS → Tunnel → cloudflared → demo-api</text>
  <text class="xs" x="752" y="612">2 Login: browser → auth. → Keycloak (PKCE); SSO to Access, Argo CD, Grafana</text>
  <text class="xs" x="752" y="628">3 Service call: demo-api → payments-svc, client-credentials token</text>
  <text class="xs" x="752" y="644">4 Release: CI → ECR (signed image + chart) → Argo CD pulls the chart</text>
  <text class="xs" x="752" y="660">5 GitOps: gitops repo → Argo CD → syncs every workload in EKS</text>

  <!-- flow 1: request -->
  <path class="arr" d="M190 131 H249"/>
  <path class="arr" d="M480 134 H509"/>
  <path class="arr" d="M780 134 H809"/>
  <path class="arr" d="M980 164 V186 H810 V235"/>
  <path class="arr" d="M810 280 L355 299"/>
  <path class="arr" d="M810 280 L645 299"/>
  <path class="arr" d="M810 280 L800 299"/>
  <!-- flow 3: service call -->
  <path class="arr" d="M430 330 H454"/>
  <!-- databases -->
  <path class="stub" d="M645 360 V378"/>
  <path class="stub" d="M800 360 V378"/>
  <path class="arr2" d="M410 360 V378 H1040 V361"/>
  <text class="lbl" x="1048" y="375">SQL</text>
  <!-- secrets -->
  <path class="arr2" d="M240 262 H479"/>
  <!-- observability -->
  <path class="arr2" d="M885 425 H929"/>
  <!-- flow 4: release -->
  <path class="arr" d="M145 606 V527"/>
  <path class="arr" d="M240 495 H289"/>
  <path class="arr2" d="M330 606 V569"/>
  <text class="lbl" x="340" y="598">Terraform apply via OIDC</text>
  <!-- flow 5: gitops -->
  <path class="arr" d="M500 606 L402 521"/>
  <path class="sync" d="M345 470 V361"/>

  <!-- badges -->
  <circle class="badge" cx="220" cy="118" r="9"/><text class="bt" x="220" y="122">1</text>
  <circle class="badge" cx="900" cy="186" r="9"/><text class="bt" x="900" y="190">1</text>
  <circle class="badge" cx="560" cy="283" r="9"/><text class="bt" x="560" y="287">1</text>
  <circle class="badge" cx="825" cy="290" r="9"/><text class="bt" x="825" y="294">2</text>
  <circle class="badge" cx="442" cy="318" r="9"/><text class="bt" x="442" y="322">3</text>
  <circle class="badge" cx="160" cy="566" r="9"/><text class="bt" x="160" y="570">4</text>
  <circle class="badge" cx="264" cy="483" r="9"/><text class="bt" x="264" y="487">4</text>
  <circle class="badge" cx="462" cy="560" r="9"/><text class="bt" x="462" y="564">5</text>
  <circle class="badge" cx="358" cy="412" r="9"/><text class="bt" x="358" y="416">5</text>
</svg>
