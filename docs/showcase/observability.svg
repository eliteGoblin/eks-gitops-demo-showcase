<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Observability</title>
  <desc id="d">The services emit OpenTelemetry to one ADOT collector, which sends traces to X-Ray and metrics to Managed Prometheus; Fluent Bit ships every pod's stdout, audit lines included, to CloudWatch Logs; Grafana reads the three backends with Keycloak SSO and one public dashboard.</desc>
  <style>
    .bg{fill:#f7f8fa}
    .card{fill:#ffffff;stroke:#dfe3e8;stroke-width:1.5}
    .zone{fill:none;stroke:#9aa4b1;stroke-width:1.5;stroke-dasharray:7 5}
    .group{fill:#ffffff;stroke:#9aa4b1;stroke-width:1.5;stroke-dasharray:4 4}
    .soft{fill:#e3eef9;stroke:#0b5fa5;stroke-width:1.5}
    .okbox{fill:#e2f3ea;stroke:#1e7f4f;stroke-width:1.5}
    .warnbox{fill:#fff3dc;stroke:#9a5b00;stroke-width:1.5}
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b1f24;font-size:13px}
    .title{font-size:19px;font-weight:700}
    .sub{font-size:13px;fill:#5b6470}
    .zl{font-size:13px;font-weight:700;fill:#5b6470}
    .b{font-size:14px;font-weight:700}
    .s{font-size:12.5px;fill:#5b6470}
    .lbl{font-size:12px;fill:#0b5fa5;font-style:italic}
    .arr{fill:none;stroke:#0b5fa5;stroke-width:2;marker-end:url(#ah)}
    .arr2{fill:none;stroke:#5b6470;stroke-width:1.8;marker-end:url(#ah2)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5fa5"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6470"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="500" rx="12"/>

  <text class="title" x="30" y="36">Observability</text>
  <text class="sub" x="30" y="58">The services speak OpenTelemetry only; collectors and backends are platform (gitops/addons/), Grafana is the one UI (gitops/apps/dev/grafana.yaml).</text>

  <!-- EKS zone -->
  <rect class="zone" x="30" y="85" width="545" height="385" rx="10"/>
  <text class="zl" x="42" y="104">EKS</text>

  <!-- workloads group -->
  <rect class="group" x="45" y="115" width="260" height="250" rx="8"/>
  <text class="zl" x="57" y="133">Workloads (namespace demo)</text>

  <rect class="okbox" x="60" y="145" width="230" height="130" rx="8"/>
  <text class="b" x="70" y="165">demo-api</text>
  <text class="s" x="70" y="182">OpenTelemetry SDK (service kit)</text>
  <text class="s" x="70" y="199">traces: HTTP → GraphQL → SQL</text>
  <text class="s" x="70" y="216">RED metrics with bounded labels</text>
  <text class="s" x="70" y="233">JSON logs with trace_id, request_id</text>
  <text class="s" x="70" y="250">audit lines: every allow and deny</text>

  <rect class="okbox" x="60" y="290" width="230" height="62" rx="8"/>
  <text class="b" x="70" y="310">payments-svc</text>
  <text class="s" x="70" y="327">same kit; its spans continue</text>
  <text class="s" x="70" y="342">demo-api's traces; metrics, logs</text>

  <!-- collectors -->
  <rect class="soft" x="345" y="115" width="215" height="125" rx="8"/>
  <text class="b" x="355" y="135">ADOT collector</text>
  <text class="s" x="355" y="152">OTLP gRPC :4317, HTTP :4318</text>
  <text class="s" x="355" y="169">traces → X-Ray</text>
  <text class="s" x="355" y="186">metrics → Managed Prometheus</text>
  <text class="s" x="355" y="203">scrapes kube-state-metrics</text>
  <text class="s" x="355" y="220">and the kubelets' cAdvisor</text>

  <rect class="soft" x="345" y="290" width="215" height="70" rx="8"/>
  <text class="b" x="355" y="310">Fluent Bit (DaemonSet)</text>
  <text class="s" x="355" y="327">every pod's stdout, JSON parsed</text>
  <text class="s" x="355" y="342">namespaces demo, keycloak,</text>
  <text class="s" x="355" y="355">observability, argocd</text>

  <!-- backends -->
  <rect class="card" x="615" y="115" width="240" height="60" rx="8"/>
  <text class="b" x="627" y="135">X-Ray</text>
  <text class="s" x="627" y="152">traces, one per request</text>
  <text class="s" x="627" y="167">SQL spans named after the sqlc query</text>

  <rect class="card" x="615" y="195" width="240" height="60" rx="8"/>
  <text class="b" x="627" y="215">Managed Prometheus</text>
  <text class="s" x="627" y="232">remote write, SigV4 via Pod Identity</text>
  <text class="s" x="627" y="247">RED series, HPA replicas, pod CPU</text>

  <rect class="card" x="615" y="290" width="240" height="70" rx="8"/>
  <text class="b" x="627" y="310">CloudWatch Logs</text>
  <text class="s" x="627" y="327">log group /eks-gitops-demo/apps</text>
  <text class="s" x="627" y="342">7-day retention, one stream per pod</text>
  <text class="s" x="627" y="355">audit lines included</text>

  <!-- Grafana -->
  <rect class="warnbox" x="900" y="115" width="270" height="190" rx="8"/>
  <text class="b" x="912" y="135">Grafana</text>
  <text class="s" x="912" y="152">Keycloak SSO: grafana-admins → Admin,</text>
  <text class="s" x="912" y="169">grafana-viewers → Viewer (demo.guest)</text>
  <text class="s" x="912" y="186">datasources: Managed Prometheus,</text>
  <text class="s" x="912" y="203">X-Ray, CloudWatch Logs (Pod Identity)</text>
  <text class="s" x="912" y="220">dashboard “demo-api: RED + scaling”</text>
  <text class="s" x="912" y="237">one public read-only link, no login</text>
  <text class="s" x="912" y="254">alert rule → SNS topic (email)</text>
  <text class="s" x="912" y="271">state in RDS, dashboard JSON in Git</text>
  <text class="s" x="912" y="288">(gitops/charts/grafana-prereqs/)</text>

  <rect class="card" x="900" y="365" width="270" height="75" rx="8"/>
  <text class="b" x="912" y="385">Browser</text>
  <text class="s" x="912" y="402">Cloudflare Access → Keycloak login,</text>
  <text class="s" x="912" y="417">then Grafana SSO on the same session;</text>
  <text class="s" x="912" y="432">public dashboard paths bypass Access</text>

  <!-- arrows -->
  <path class="arr" d="M305 175 H344"/>
  <text class="lbl" x="325" y="168" text-anchor="middle">OTLP</text>
  <path class="arr" d="M305 283 L344 298"/>
  <text class="lbl" x="318" y="275" text-anchor="middle">stdout</text>
  <path class="arr" d="M560 145 H614"/>
  <text class="lbl" x="587" y="138" text-anchor="middle">traces</text>
  <path class="arr" d="M560 225 H614"/>
  <text class="lbl" x="587" y="218" text-anchor="middle">metrics</text>
  <path class="arr" d="M560 325 H614"/>
  <text class="lbl" x="587" y="318" text-anchor="middle">logs</text>
  <path class="arr2" d="M855 145 H899"/>
  <path class="arr2" d="M855 225 H899"/>
  <path class="arr2" d="M855 325 L899 290"/>
  <text class="lbl" x="877" y="258" text-anchor="middle">reads</text>
  <path class="arr2" d="M1035 364 V306"/>
</svg>
