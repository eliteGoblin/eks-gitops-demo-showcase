# gitleaks configuration: the default rules plus narrow, justified allowlists.
[extend]
useDefault = true

# The dev/kind Keycloak realm ships fixed, shareable demo passwords (rotated
# after demos). Allow only those password values in that one file, so any other
# secret added to the realm (a client secret, a token) is still reported.
[[allowlists]]
description = "Dev realm demo passwords (Word-Word-NNNN! pattern) in deploy/keycloak/realm.json"
condition = "AND"
paths = ['''deploy/keycloak/realm\.json''']
regexTarget = "line"
regexes = ['''"value":\s*"[A-Z][a-z]+-[A-Z][a-z]+-[0-9]{4}!"''']

# verify.sh passes a token it just fetched from a shell variable ($IDT): no literal secret.
[[allowlists]]
description = "curl Authorization header built from a shell variable in scripts/verify.sh"
condition = "AND"
paths = ['''scripts/verify\.sh''']
regexTarget = "line"
regexes = ['''Authorization: Bearer \$[A-Z_]+''']

# Dev-realm client secrets for local service-to-service demos (demo-api-svc,
# load-generator). They only work against the throwaway compose/kind Keycloak;
# the production realm gets generated secrets from Secrets Manager.
[[allowlists]]
description = "Dev realm client secrets (dev-only-* values) in deploy/keycloak/realm.json"
condition = "AND"
paths = ['''deploy/keycloak/realm\.json''']
regexTarget = "line"
regexes = ['''"secret":\s*"dev-only-[a-z-]+"''']

# sops-encrypted values in secrets/**/*.enc.yaml are ciphertext (ENC[AES256_GCM,...]);
# any plaintext accidentally committed there would not match and is still reported.
[[allowlists]]
description = "sops ciphertext in secrets/**/*.enc.yaml"
condition = "AND"
paths = ['''secrets/.*\.enc\.yaml''']
regexTarget = "line"
regexes = ['''ENC\[AES256_GCM,data:''']
